name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Typecheck app and core
        run: npm run typecheck
      - name: Unit tests (core)
        run: npm test
      - name: Database migrations, RLS and invariants
        run: npm run test:db
      - name: Typecheck Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
